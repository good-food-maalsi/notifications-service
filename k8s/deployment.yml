apiVersion: apps/v1
kind: Deployment
metadata:
    name: notifications-service
    labels:
        app: notifications-service
spec:
    replicas: 1
    revisionHistoryLimit: 3
    selector:
        matchLabels:
            app: notifications-service
    template:
        metadata:
            labels:
                app: notifications-service
        spec:
            imagePullSecrets:
                - name: scw-registry-secret
            containers:
                - name: notifications-service
                  image: rg.fr-par.scw.cloud/good-food-container-registry/notifications-service:7f601ca8ac73c2fbfbef95aeae6606cca8b05a3f
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                  resources:
                      requests:
                          memory: "32Mi"
                          cpu: "10m"
                      limits:
                          memory: "64Mi"
                          cpu: "100m"
                  envFrom:
                      - configMapRef:
                            name: notifications-service-config
                      - secretRef:
                            name: rabbitmq-secret
---
apiVersion: v1
kind: Service
metadata:
    name: notifications-service
spec:
    selector:
        app: notifications-service
    ports:
        - protocol: TCP
          port: 8080
          targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: notifications-service-config
data:
    NODE_ENV: "production"
    PORT: "8080"
